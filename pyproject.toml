[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m396"
version = "0.1.0"
description = "396 — the mood-channel machine. Measures what a track IS (gait, texture, layer, pace) and routes it to named mood channels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ross MacDonald" }]
keywords = ["music", "audio", "analysis", "mood", "librosa"]
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.scripts]
m396 = "m396.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]